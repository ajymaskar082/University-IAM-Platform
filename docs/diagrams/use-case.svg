 <circle cx="1635" cy="1035" r="17" fill="none" stroke="#263746" stroke-width="3"/>
 <path d="M1635 1052 V1111 M1607 1075 H1663 M1635 1111 L1611 1147 M1635 1111 L1659 1147" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
 <text x="1635" y="1175" class="actorText" text-anchor="middle">ҚАУІПСІЗДІК МАМАНЫ</text>
 </g><ellipse cx="570" cy="220" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="226" class="ucText">Пайдаланушыны тіркеу</text><ellipse cx="570" cy="350" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="356" class="ucText">Жүйеге кіру</text><ellipse cx="570" cy="480" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="486" class="ucText">Көп факторлы тексеру</text><ellipse cx="570" cy="610" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="616" class="ucText">Сессиялар мен токендерді басқару</text><ellipse cx="570" cy="740" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="746" class="ucText">Пайдаланушылар мен рөлдерді басқару</text><ellipse cx="570" cy="870" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="876" class="ucText">Тіркелгі күйін басқару</text><ellipse cx="570" cy="1000" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="1006" class="ucText">Қауіпсіздік саясатын басқару</text><ellipse cx="570" cy="1130" rx="205" ry="43" class="ellipse"/>
 <text x="570" y="1136" class="ucText">Қорғалған ресурстарға қол жеткізу</text><ellipse cx="1120" cy="220" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="226" class="ucText">Рөлдер бойынша құқықтарды тексеру</text><ellipse cx="1120" cy="350" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="356" class="ucText">Атрибуттар бойынша құқықтарды тексеру</text><ellipse cx="1120" cy="480" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="486" class="ucText">Жеке профильді басқару</text><ellipse cx="1120" cy="610" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="616" class="ucText">Оқу ақпаратын қарау</text><ellipse cx="1120" cy="740" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="746" class="ucText">Пәндер мен бағаларды басқару</text><ellipse cx="1120" cy="870" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="876" class="ucText">Факультет ақпаратын басқару</text><ellipse cx="1120" cy="1000" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="1006" class="ucText">Қызметкерлер тіркелгілерін басқару</text><ellipse cx="1120" cy="1130" rx="205" ry="43" class="ellipse"/>
 <text x="1120" y="1136" class="ucText">Қауіпсіздік оқиғалары мен журналдарын бақылау</text><path d="M190 298 L365 220" class="assoc"/><path d="M190 298 L365 350" class="assoc"/><path d="M190 298 L365 740" class="assoc"/><path d="M190 298 L365 870" class="assoc"/><path d="M190 298 L365 1000" class="assoc"/><path d="M190 298 L915 1130" class="assoc"/><path d="M190 538 L365 220" class="assoc"/><path d="M190 538 L365 350" class="assoc"/><path d="M190 538 L365 740" class="assoc"/><path d="M190 538 L365 870" class="assoc"/><path d="M190 798 L365 350" class="assoc"/><path d="M190 798 L365 610" class="assoc"/><path d="M190 798 L365 1130" class="assoc"/><path d="M190 798 L915 480" class="assoc"/><path d="M190 798 L915 610" class="assoc"/><path d="M190 1058 L365 350" class="assoc"/><path d="M190 1058 L365 610" class="assoc"/><path d="M190 1058 L365 1130" class="assoc"/><path d="M190 1058 L915 480" class="assoc"/><path d="M190 1058 L915 740" class="assoc"/><path d="M1610 378 L775 350" class="assoc"/><path d="M1610 378 L775 1130" class="assoc"/><path d="M1610 378 L1325 480" class="assoc"/><path d="M1610 378 L1325 870" class="assoc"/><path d="M1610 738 L775 350" class="assoc"/><path d="M1610 738 L775 1130" class="assoc"/><path d="M1610 738 L1325 1000" class="assoc"/><path d="M1610 1098 L775 350" class="assoc"/><path d="M1610 1098 L775 1000" class="assoc"/><path d="M1610 1098 L1325 1130" class="assoc"/>
