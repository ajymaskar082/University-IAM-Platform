<rect width="100%" height="100%" fill="#ffffff"/>
<text x="900" y="55" class="heading" text-anchor="middle">UML ҚОЛДАНУ ЖАҒДАЙЛАРЫ ДИАГРАММАСЫ</text>
<rect x="370" y="105" width="1060" height="1190" rx="12" class="sys"/>
<text x="900" y="145" class="heading" text-anchor="middle" style="font-size:24px">Университеттің сәйкестендіру және қолжетімділікті басқару жүйесі</text><g>
 <circle cx="145" cy="235" r="17" fill="none" stroke="#263746" stroke-width="3"/>
 <path d="M145 252 V311 M117 275 H173 M145 311 L121 347 M145 311 L169 347" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
 <text x="145" y="375" class="actorText" text-anchor="middle">БАС ӘКІМШІ</text>
 </g><g>
 <circle cx="145" cy="475" r="17" fill="none" stroke="#263746" stroke-width="3"/>
 <path d="M145 492 V551 M117 515 H173 M145 551 L121 587 M145 551 L169 587" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
 <text x="145" y="615" class="actorText" text-anchor="middle">ӘКІМШІ</text>
