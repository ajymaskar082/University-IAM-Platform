 <circle cx="145" cy="735" r="17" fill="none" stroke="#263746" stroke-width="3"/>
 <path d="M145 752 V811 M117 775 H173 M145 811 L121 847 M145 811 L169 847" fill="none" stroke="#263746" stroke-width="3" stroke-linecap="round"/>
